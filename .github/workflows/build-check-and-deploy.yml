name: CI/CD Process

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    name: Build and Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest] # , windows-latest]
        java: ['21', '25']
    defaults:
      run:
        shell: bash 
    steps:
      - &checkout
        name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - &setup-java
        name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
      - &mill-cache
        name: Cache Mill dependencies
        uses: coursier/cache-action@95e5b1029b6b86e7bac033ee44a0697d8a527d2d # v8.1.1
      - name: Build Project
        run: ./mill __.compile
      - name: Run Tests
        run: ./mill __.test

  qa:
    name: Code Quality Analysis
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest] # , windows-latest]
        java: ['21', '25']
    defaults:
      run:
        shell: bash 
    steps:
      - *checkout
      - *setup-java
      - *mill-cache
      - name: Run Code Quality Analysis
        run: "true" # Currently QA tools are not aware of capture checking, so they fail because of parsing errors.
        # run: |
        #   ./mill mill.scalalib.scalafmt/checkFormatAll
        #   ./mill __.fix --check
        
  success:
    runs-on: ubuntu-24.04
    needs:
      - qa
      - build
    if: >-
      always() && (
        contains(join(needs.*.result, ','), 'failure')
        || !contains(join(needs.*.result, ','), 'cancelled')
      )
    steps:
      - name: Verify that there were no failures
        run: ${{ !contains(join(needs.*.result, ','), 'failure') }}      